name: 功能请求
description: 请求新功能
title: "[功能请求] 请修改我为您的问题"
labels: ["enhancement/新功能"]
assignees:
  - hmjz100
body:
  - type: markdown
    attributes:
      value: |
        感谢您花时间填写此报告。

  - type: checkboxes
    attributes:
      label: 确认
      description: 您必须确认、同意并勾选以下事项。
      options:
        - label: |
            我已确认阅读并同意 [AGPL-3.0 第 15 条](https://www.gnu.org/licenses/agpl-3.0.txt#:~:text=15.%20Disclaimer%20of%20Warranty.) 。
            本项目不提供任何明示或暗示的担保，使用风险由您自行承担。
          required: true
        - label: |
            我已确认阅读并同意 [AGPL-3.0 第 16 条](https://www.gnu.org/licenses/agpl-3.0.txt#:~:text=16.%20Limitation%20of%20Liability.) 。
            无论何种情况，版权持有人或其他分发者均不对使用本程序所造成的任何损失承担责任。
          required: true
        - label: 我已确认此脚本不存在此功能，而不是因其他原因（例如网络、脚本依赖或操作）造成的无功能。
          required: true
        - label: 我已安装金丝雀版，并且确认金丝雀版未实现此功能。
          required: true
        - label: 我已查找过其他议题，确认没有重复的功能请求。
          required: true
        - label: 我已修改上方标题的 “请修改我为您的问题” 为自己的问题。
          required: true

  - type: markdown
    attributes:
      value: |
        **注意：不符合上述条件的提交将被直接关闭或忽略，恕不逐一排查。**
        如果您其实还不确定问题出在哪里，不了解计算机，建议先花点时间看看 [你缺失的那门计算机课（网页版）](https://www.criwits.top/missing/) 了解计算机基础，以及如何在搜索引擎中查找正确的信息。
        若只是使用疑问、环境配置或求助，请不要直接开功能请求，而是[前往社区](https://github.com/hmjz100/LinkSwift/discussions)发帖交流。

  - type: textarea
    id: issue-today
    attributes:
      label: 存在问题
      description: 目前存在什么问题
      placeholder: 脚本目前不能……

  - type: textarea
    id: target-tomorrow
    attributes:
      label: 目标愿景
      description: 希望实现的目标
      placeholder: 希望能……
    validations:
      required: true

  - type: textarea
    id: advice-if
    attributes:
      label: 参考建议
      description: 可供参考的建议、思路或者示例
      placeholder: |
        有什么实现思路，或者参考的样例？
        **截图可以直接 Ctrl-V 粘贴哦~**
